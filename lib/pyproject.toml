[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-thehive-connector"
version = "1.0.0"
description = "Conector Ruvic de gestión de casos e incidentes para TheHive"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_thehive_connector*"]
